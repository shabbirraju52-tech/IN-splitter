name: Build Invoice Splitter Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Tesseract OCR
        shell: powershell
        run: |
          $url = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tesseract.exe"
          Start-Process "$env:TEMP\tesseract.exe" -ArgumentList '/S' -Wait

          $src = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path $src)) {
            throw 'Tesseract installation was not found.'
          }

          Copy-Item $src 'tesseract' -Recurse -Force

      - name: Add Arabic OCR data
        shell: powershell
        run: |
          $url = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata'
          Invoke-WebRequest -Uri $url -OutFile 'tesseract\tessdata\ara.traineddata'
          if (!(Test-Path 'tesseract\tessdata\ara.traineddata')) {
            throw 'Arabic OCR data was not downloaded.'
          }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name InvoiceSplitter `
            --add-data "tesseract;tesseract" `
            invoice_splitter.py

      - name: Package EXE
        shell: powershell
        run: |
          Compress-Archive `
            -Path 'dist\InvoiceSplitter.exe' `
            -DestinationPath 'InvoiceSplitter-Windows.zip' `
            -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceSplitter-Windows
          path: InvoiceSplitter-Windows.zip
